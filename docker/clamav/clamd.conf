# clamd 用設定（HC-21）。マウントして読むだけなので、DB 更新は db-updater コンテナが担う。
# Alpine 3.22 / ClamAV 1.4.3 で受理されるオプションのみを使う。
Foreground yes
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 4
DatabaseDirectory /var/lib/clamav
PidFile /var/run/clamav/clamd.pid
TemporaryDirectory /tmp
IdleTimeout 300

# 深掘り検査（HC-23 と同じ方針をサーバ側でも明示）
ScanArchive yes
ScanPDF yes
ScanHTML yes
ScanOLE2 yes
ScanXMLDOCS yes
ScanPE yes
ScanELF yes
MaxDirectoryRecursion 30
MaxEmbeddedPE 10M
MaxHTMLNormalize 10M
MaxScriptNormalize 5M
MaxZipTypeRcg 1M
MaxPartitions 40
MaxIconsPE 100

# 暗号化・上限超過・壊れた実行ファイルは検出扱い（HC-23）
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertExceedsMax yes
AlertBrokenExecutables yes
AlertBrokenMedia yes
HeuristicAlerts yes

LogTime yes
LogSyslog no
